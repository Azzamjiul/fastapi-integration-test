[project]
name = "simple-crud"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.17.0",
    "fastapi>=0.119.0",
    "httpx>=0.28.1",
    "psycopg2-binary>=2.9.11",
    "pytest>=8.4.2",
    "python-dotenv>=1.1.1",
    "sqlalchemy>=2.0.44",
    "testcontainers>=4.13.2",
    "uvicorn>=0.37.0",
]

[tool.pytest.ini_options]
filterwarnings = [
    # Ignore deprecation warnings from testcontainers library internals
    # These are internal to the library and will be fixed by testcontainers maintainers
    "ignore:The @wait_container_is_ready decorator is deprecated:DeprecationWarning:testcontainers",
]
